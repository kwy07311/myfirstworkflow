name: Run Volatility Scraper

on:
  workflow_dispatch: # 버튼 눌러서 직접 실행하는 설정

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl urllib3 beautifulsoup4

      - name: Run script
        run: |
          python make_volatility_excel.py

      - name: Commit and push result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add volatility_result.xlsx
          git commit -m "Automated volatility result update" || exit 0
          git push
