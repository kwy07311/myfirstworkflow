name: 종목추출

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stock-screener:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 필요한 라이브러리 설치
      - name: Install packages
        run: |
          pip install pandas openpyxl requests numpy

      # 4. 암호화된 KIS 토큰 캐시 복호화
      - name: Decrypt cached token
        run: |
          if [ -f stock_screener/.token_state.enc ]; then
            echo "암호화된 토큰 캐시 발견 → 복호화 시도"

            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in stock_screener/.token_state.enc \
              -out stock_screener/.token_state.json \
              -pass pass:"${{ secrets.TOKEN_CACHE_KEY }}" \
              || {
                echo "복호화 실패 → 기존 토큰 캐시를 사용하지 않고 새로 발급합니다."
                rm -f stock_screener/.token_state.json
              }
          else
            echo "암호화된 토큰 캐시 없음 → 새로 발급합니다."
          fi

      # 5. 통합 종목 검색 실행
      - name: Run stock screener
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd stock_screener
          python find_my_strategy.py

      # 6. 토큰 상태 파일 다시 암호화
      - name: Encrypt token state
        if: always()
        run: |
          if [ -f stock_screener/.token_state.json ]; then

            echo "토큰 상태 파일 암호화 중..."

            openssl enc -e -aes-256-cbc -pbkdf2 \
              -in stock_screener/.token_state.json \
              -out stock_screener/.token_state.enc \
              -pass pass:"${{ secrets.TOKEN_CACHE_KEY }}"

            rm -f stock_screener/.token_state.json

            echo "토큰 상태 암호화 완료"

          else
            echo "암호화할 토큰 상태 파일이 없습니다."
          fi

      # 7. data.json + 암호화된 토큰 캐시 저장
      - name: Commit and Push data.json
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 통합 스크리너 결과
          if [ -f docs/data.json ]; then
            git add docs/data.json
            echo "docs/data.json 추가됨"
          else
            echo "경고: docs/data.json 파일이 없습니다."
          fi

          # 암호화된 KIS 토큰 캐시
          if [ -f stock_screener/.token_state.enc ]; then
            git add stock_screener/.token_state.enc
            echo "토큰 캐시 추가됨"
          fi

          # 변경사항 확인
          echo "===== Git 변경사항 ====="
          git status --short

          # 변경사항이 없으면 종료
          if git diff --cached --quiet; then
            echo "커밋할 변경사항이 없습니다."
            exit 0
          fi

          # 커밋
          git commit -m "auto: update stock screener data"

          # GitHub에 push
          git push

          echo "===== GitHub Push 완료 ====="
