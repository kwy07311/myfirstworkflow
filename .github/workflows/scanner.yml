name: Stock Scanner

on:
  # GitHub Actions에서 Run workflow 버튼으로 실행
  workflow_dispatch:

  # 평일 18:00(KST) 자동 실행
  schedule:
    - cron: '0 9 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: stock-result
          path: result.xlsx
