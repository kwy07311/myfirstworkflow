<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<title>종목 스크리너</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f7f7f9;
    color: #222;
  }

  header {
    margin-bottom: 16px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
  }

  .timestamp {
    color: #666;
    font-size: 14px;
    margin-bottom: 16px;
  }

  .stock-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .stock-item {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .stock-name {
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 10px;
  }

  .match-info {
    font-size: 13px;
    color: #666;
    margin-bottom: 10px;
  }

  .btn-group {
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
  }

  .btn-naver {
    background: #03c75a;
    color: #fff;
  }

  .btn-youtube {
    background: #ff0000;
    color: #fff;
  }

  .empty {
    text-align: center;
    color: #888;
    padding: 40px 0;
  }

  .error {
    text-align: center;
    color: #d33;
    padding: 40px 0;
  }

</style>

</head>


<body>

<header>

  <h1>📊 종목 스크리너</h1>

</header>


<div class="timestamp" id="timestamp">
  불러오는 중...
</div>


<ul class="stock-list" id="stockList"></ul>


<div class="empty" id="emptyMsg" style="display:none;">
  오늘 조건을 만족한 종목이 없습니다.
</div>


<div class="error" id="errorMsg" style="display:none;">
  데이터를 불러올 수 없습니다.
</div>


<script>


/*
 * 종목명 표시
 *
 * 삼성전자_005930
 *       ↓
 * 삼성전자
 */
function getDisplayName(raw) {

  // 혹시 문자열 형태의 데이터가 들어오는 경우도 처리
  if (typeof raw === "string") {

    const idx = raw.lastIndexOf("_");

    return idx === -1
      ? raw
      : raw.slice(0, idx);
  }

  // 객체 형태
  if (raw && typeof raw === "object" && raw.name) {

    const idx = raw.name.lastIndexOf("_");

    return idx === -1
      ? raw.name
      : raw.name.slice(0, idx);
  }

  return "";
}


/*
 * 기법 표시
 */
function getMatchedBy(raw) {

  // 문자열 형태
  if (typeof raw === "string") {
    return "";
  }

  // 객체 형태
  if (raw && typeof raw === "object") {

    return raw.matched_by || "";
  }

  return "";
}


/*
 * 종목 목록 화면 출력
 */
function renderStocks(data) {

  const timestampEl =
    document.getElementById("timestamp");

  const listEl =
    document.getElementById("stockList");

  const emptyEl =
    document.getElementById("emptyMsg");

  const errorEl =
    document.getElementById("errorMsg");


  // 기존 목록 초기화
  listEl.innerHTML = "";


  // 오류 메시지 숨김
  errorEl.style.display = "none";


  /*
   * 날짜 / 시간 표시
   */
  if (data.date && data.time) {

    timestampEl.textContent =
      `${data.date} ${data.time} 기준`;

  }
  else if (data.date) {

    timestampEl.textContent =
      `${data.date} 기준`;

  }
  else {

    timestampEl.textContent =
      "";

  }


  /*
   * 종목이 없는 경우
   */
  if (
    !Array.isArray(data.stocks) ||
    data.stocks.length === 0
  ) {

    emptyEl.style.display = "block";

    return;

  }


  emptyEl.style.display = "none";


  /*
   * 종목 출력
   */
  data.stocks.forEach(raw => {

    const name =
      getDisplayName(raw);

    const matchedBy =
      getMatchedBy(raw);


    // 종목명이 없으면 건너뜀
    if (!name) {
      return;
    }


    /*
     * li
     */
    const li =
      document.createElement("li");

    li.className =
      "stock-item";


    /*
     * 종목명
     */
    const nameEl =
      document.createElement("div");

    nameEl.className =
      "stock-name";

    nameEl.textContent =
      name;


    /*
     * 매칭 기법 표시
     */
    const matchEl =
      document.createElement("div");

    matchEl.className =
      "match-info";


    if (matchedBy === "A") {

      matchEl.textContent =
        "📉 기법 A";

    }
    else if (matchedBy === "B") {

      matchEl.textContent =
        "📈 기법 B";

    }
    else if (matchedBy === "A+B") {

      matchEl.textContent =
        "📊 기법 A + B";

    }
    else {

      matchEl.textContent =
        "";

    }


    /*
     * 버튼 그룹
     */
    const btnGroup =
      document.createElement("div");

    btnGroup.className =
      "btn-group";


    /*
     * 네이버 검색 버튼
     */
    const naverBtn =
      document.createElement("a");

    naverBtn.className =
      "btn btn-naver";

    naverBtn.textContent =
      "네이버 검색";

    naverBtn.href =
      `https://search.naver.com/search.naver?query=${
        encodeURIComponent(name + " 주가")
      }`;

    naverBtn.target =
      "_blank";

    naverBtn.rel =
      "noopener noreferrer";


    /*
     * 유튜브 검색 버튼
     */
    const ytBtn =
      document.createElement("a");

    ytBtn.className =
      "btn btn-youtube";

    ytBtn.textContent =
      "유튜브 검색";

    ytBtn.href =
      `https://www.youtube.com/results?search_query=${
        encodeURIComponent(name)
      }`;

    ytBtn.target =
      "_blank";

    ytBtn.rel =
      "noopener noreferrer";


    /*
     * 버튼 추가
     */
    btnGroup.appendChild(
      naverBtn
    );

    btnGroup.appendChild(
      ytBtn
    );


    /*
     * 내용 추가
     */
    li.appendChild(
      nameEl
    );


    if (matchedBy) {

      li.appendChild(
        matchEl
      );

    }


    li.appendChild(
      btnGroup
    );


    /*
     * 목록에 추가
     */
    listEl.appendChild(
      li
    );

  });

}


/*
 * data.json 불러오기
 *
 * GitHub Pages 캐시 방지
 */
function loadData() {

  const dataUrl =
    "./data.json?t=" + Date.now();


  fetch(
    dataUrl,
    {
      cache: "no-store"
    }
  )

  .then(res => {

    if (!res.ok) {

      throw new Error(
        `HTTP error: ${res.status}`
      );

    }

    return res.json();

  })


  .then(data => {

    console.log(
      "data.json:",
      data
    );

    renderStocks(
      data
    );

  })


  .catch(err => {

    console.error(
      "데이터를 불러오는 중 오류:",
      err
    );


    document.getElementById(
      "timestamp"
    ).textContent =
      "데이터를 불러올 수 없습니다.";


    document.getElementById(
      "errorMsg"
    ).style.display =
      "block";

  });

}


/*
 * 페이지 로딩 시 실행
 */
loadData();

</script>

</body>
</html>
