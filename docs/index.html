<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>종목 스크리너</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f7f7f9;
    color: #222;
  }
  header { margin-bottom: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .timestamp { color: #666; font-size: 14px; }

  /* 탭 */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid #ddd;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    border: none;
    background: none;
    font-size: 15px;
    font-weight: 600;
    color: #999;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active {
    color: #222;
  }
  .tab-btn[data-tab="breakout"].active { border-bottom-color: #03c75a; }
  .tab-btn[data-tab="ma"].active { border-bottom-color: #3b82f6; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .stock-list { list-style: none; padding: 0; }
  .stock-item {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .stock-name { font-weight: 600; font-size: 16px; margin-bottom: 10px; }
  .btn-group { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
  }
  .btn-naver { background: #03c75a; color: #fff; }
  .btn-youtube { background: #ff0000; color: #fff; }
  .empty { text-align: center; color: #888; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>📊 종목 스크리너</h1>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="breakout">📈 변동폭 돌파</button>
  <button class="tab-btn" data-tab="ma">📉 5일선 반전</button>
</div>

<!-- 기존 기법: 변동폭 돌파 -->
<div class="tab-panel active" id="panel-breakout">
  <div class="timestamp" id="timestamp-breakout">불러오는 중...</div>
  <ul class="stock-list" id="stockList-breakout"></ul>
  <div class="empty" id="emptyMsg-breakout" style="display:none;">오늘 조건을 만족한 종목이 없습니다.</div>
</div>

<!-- 신규 기법: 5일 이평선 하향 + 양봉 -->
<div class="tab-panel" id="panel-ma">
  <div class="timestamp" id="timestamp-ma">불러오는 중...</div>
  <ul class="stock-list" id="stockList-ma"></ul>
  <div class="empty" id="emptyMsg-ma" style="display:none;">오늘 조건을 만족한 종목이 없습니다.</div>
</div>

<script>
function getDisplayName(raw) {
  // "삼성전자_005930" -> "삼성전자"
  const idx = raw.lastIndexOf('_');
  return idx === -1 ? raw : raw.slice(0, idx);
}

function renderStocks(data, prefix) {
  const timestampEl = document.getElementById(`timestamp-${prefix}`);
  const listEl = document.getElementById(`stockList-${prefix}`);
  const emptyEl = document.getElementById(`emptyMsg-${prefix}`);

  timestampEl.textContent = `${data.date} ${data.time} 기준`;

  if (!data.stocks || data.stocks.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }

  data.stocks.forEach(raw => {
    const name = getDisplayName(raw);

    const li = document.createElement('li');
    li.className = 'stock-item';

    const nameEl = document.createElement('div');
    nameEl.className = 'stock-name';
    nameEl.textContent = name;

    const btnGroup = document.createElement('div');
    btnGroup.className = 'btn-group';

    const naverBtn = document.createElement('a');
    naverBtn.className = 'btn btn-naver';
    naverBtn.textContent = '네이버 검색';
    naverBtn.href = `https://search.naver.com/search.naver?query=${encodeURIComponent(name + ' 주가')}`;
    naverBtn.target = '_blank';

    const ytBtn = document.createElement('a');
    ytBtn.className = 'btn btn-youtube';
    ytBtn.textContent = '유튜브 검색';
    ytBtn.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(name)}`;
    ytBtn.target = '_blank';

    btnGroup.appendChild(naverBtn);
    btnGroup.appendChild(ytBtn);
    li.appendChild(nameEl);
    li.appendChild(btnGroup);
    listEl.appendChild(li);
  });
}

function loadData(jsonPath, prefix) {
  fetch(jsonPath + '?_=' + Date.now())  // 캐시 방지용
    .then(res => res.json())
    .then(data => renderStocks(data, prefix))
    .catch(err => {
      document.getElementById(`timestamp-${prefix}`).textContent = '데이터를 불러올 수 없습니다.';
      console.error(err);
    });
}

// 두 기법 데이터 각각 독립적으로 로드
loadData('data.json', 'breakout');
loadData('screener_data.json', 'ma');

// 탭 전환
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

    btn.classList.add('active');
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
  });
});
</script>
</body>
</html>
