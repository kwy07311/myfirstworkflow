<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>변동폭 돌파 종목</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f7f7f9;
    color: #222;
  }
  header { margin-bottom: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .timestamp { color: #666; font-size: 14px; }
  .stock-list { list-style: none; padding: 0; }
  .stock-item {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .stock-name { font-weight: 600; font-size: 16px; margin-bottom: 10px; }
  .btn-group { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
  }
  .btn-naver { background: #03c75a; color: #fff; }
  .btn-youtube { background: #ff0000; color: #fff; }
  .empty { text-align: center; color: #888; padding: 40px 0; }
</style>
</head>
<body>

<header>
  <h1>📈 변동폭 돌파 종목</h1>
  <div class="timestamp" id="timestamp">불러오는 중...</div>
</header>

<ul class="stock-list" id="stockList"></ul>
<div class="empty" id="emptyMsg" style="display:none;">오늘 조건을 만족한 종목이 없습니다.</div>

<script>
function getDisplayName(raw) {
  // "삼성전자_005930" -> "삼성전자"
  const idx = raw.lastIndexOf('_');
  return idx === -1 ? raw : raw.slice(0, idx);
}

fetch('data.json?_=' + Date.now())  // 캐시 방지용
  .then(res => res.json())
  .then(data => {
    document.getElementById('timestamp').textContent =
      `${data.date} ${data.time} 기준`;

    const listEl = document.getElementById('stockList');
    const emptyEl = document.getElementById('emptyMsg');

    if (!data.stocks || data.stocks.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }

    data.stocks.forEach(raw => {
      const name = getDisplayName(raw);

      const li = document.createElement('li');
      li.className = 'stock-item';

      const nameEl = document.createElement('div');
      nameEl.className = 'stock-name';
      nameEl.textContent = name;

      const btnGroup = document.createElement('div');
      btnGroup.className = 'btn-group';

      const naverBtn = document.createElement('a');
      naverBtn.className = 'btn btn-naver';
      naverBtn.textContent = '네이버 검색';
      naverBtn.href = `https://search.naver.com/search.naver?query=${encodeURIComponent(name + ' 주가')}`;
      naverBtn.target = '_blank';

      const ytBtn = document.createElement('a');
      ytBtn.className = 'btn btn-youtube';
      ytBtn.textContent = '유튜브 검색';
      ytBtn.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(name)}`;
      ytBtn.target = '_blank';

      btnGroup.appendChild(naverBtn);
      btnGroup.appendChild(ytBtn);
      li.appendChild(nameEl);
      li.appendChild(btnGroup);
      listEl.appendChild(li);
    });
  })
  .catch(err => {
    document.getElementById('timestamp').textContent = '데이터를 불러올 수 없습니다.';
    console.error(err);
  });
</script>

</body>
</html>
