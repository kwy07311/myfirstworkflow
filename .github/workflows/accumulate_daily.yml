name: Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'  # 평일 18:00 KST (장마감 후)

jobs:
  accumulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # csv를 다시 커밋하려면 write 권한 필요
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run accumulator
        run: python accumulate_daily.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv_history.csv
          git diff --cached --quiet || git commit -m "chore: update ohlcv history"
          git push
