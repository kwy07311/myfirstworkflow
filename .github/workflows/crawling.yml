name: KRX Stock List

on:
  workflow_dispatch:        # 수동 실행
  schedule:
    - cron: "0 0 * * 1-5"   # 평일 KST 09:00 (UTC 00:00)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python get_krx_stock_list.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: krx-stock-list
          path: output/*.xlsx
